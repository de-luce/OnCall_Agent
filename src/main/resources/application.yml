spring:
  application:
    name: OnCall_Agent
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:lm-studio}}
      base-url: ${OPENAI_API_BASE_URL:http://127.0.0.1:1234}
      chat:
        options:
          model: ${LOCAL_LLM_MODEL:qwen/qwen3.5-9b}
          temperature: 0.3
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-nomic-embed-text-v1.5}

oncall:
  rag:
    chunk-size: 800
    chunk-overlap: 200
    top-k: 5
  memory:
    max-messages: 20
    summary-threshold: 12
  upload:
    storage-dir: ${ONCALL_STORE_DIR:src/main/resources/store}

server:
  port: 8080

logging:
  level:
    com.deluce.oncall: DEBUG
    org.springframework.ai: INFO
